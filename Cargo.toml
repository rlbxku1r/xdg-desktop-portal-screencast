[workspace]
resolver = "3"
members = ["crates/libsourceselector", "crates/sourceselector-ui", "crates/xdg-desktop-portal-screencast"]

[workspace.dependencies]
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
env_logger = "0.11.11"
freedesktop-icons = "0.4.0"
futures-util = "0.3.34"
libsourceselector = { path = "crates/libsourceselector" }
log = "0.4.34"
rust-ini = "0.21.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
zbus = { version = "5.19.0", features = ["tokio"] }
