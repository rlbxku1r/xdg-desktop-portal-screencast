[workspace]
resolver = "3"
members = ["crates/libsourceselector", "crates/sourceselector-ui", "crates/xdg-desktop-portal-screencast"]

[workspace.dependencies]
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = { version = "0.33.3", features = ["all_loaders"] }
env_logger = "0.11.8"
freedesktop-icons = "0.4.0"
futures-util = "0.3.31"
image = { version = "0.25.9" }
libsourceselector = { path = "crates/libsourceselector", version = "0.1.0" }
log = "0.4.29"
rust-ini = "0.21.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["full"] }
zbus = { version = "5.13.1", features = ["tokio"] }
